<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · wxbot 控制台</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="card login-card stack" id="f">
    <div class="row" style="gap:12px;margin-bottom:6px"><div class="brand-logo" style="width:40px;height:40px;font-size:20px">w</div>
      <div><h1>wxbot 控制台</h1><div class="muted small">管理你的所有微信机器人</div></div></div>
    <div class="field"><label>账号</label><input class="input" id="u" autocomplete="username" required></div>
    <div class="field"><label>密码</label><input class="input" id="p" type="password" autocomplete="current-password" required></div>
    <div class="small" id="err" style="color:var(--red);min-height:18px"></div>
    <button class="btn primary lg" id="go" type="submit">登录</button>
    <div class="faint small">账号密码是部署时 .env 里的 WXBOT_UI_USER / WXBOT_UI_PASSWORD</div>
  </form>
</div>
<script src="/ui/login.js"></script>
</body>
</html>
