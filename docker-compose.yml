# wxbot Ubuntu 24.04 one-command deployment (amd64/arm64).
# Run ./deploy.sh instead of invoking Compose manually.
services:
  wxbot:
    image: ${WXBOT_IMAGE:-wxbot-wechat:ubuntu-24.04}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wxbot
    init: true
    restart: unless-stopped
    shm_size: "1g"
    security_opt:
      - seccomp=unconfined          # 微信(CEF)需要
    cap_add:
      - SYS_PTRACE                   # 读 /proc/<pid>/mem 提取数据库密钥
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?VNC_PASSWORD must be set in .env}
      SCREEN: ${SCREEN:-1360x900x24}
      TZ: ${TZ:-Asia/Shanghai}
      WXBOT_BOT_AUTOSTART: ${WXBOT_BOT_AUTOSTART:-1}
      WXBOT_MEDIA_CAPTURE: ${WXBOT_MEDIA_CAPTURE:-1}
    ports:
      # 默认只绑 127.0.0.1（安全）。要局域网/公网访问改 BIND_HOST=0.0.0.0 并务必设 VNC_PASSWORD + 反代加认证
      - "${BIND_HOST:-127.0.0.1}:5100:5100"   # 后台 Web
      - "${BIND_HOST:-127.0.0.1}:6080:6080"   # noVNC(扫码/手动操作微信)
    volumes:
      - wxdata:/home/wechat          # 微信数据和登录态
      - appdata:/app/accounts        # 密钥、解密库、人设、规则和配置

volumes:
  wxdata:
  appdata:
