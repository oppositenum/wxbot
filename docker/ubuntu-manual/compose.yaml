# Compatibility entrypoint for the existing wxbot-ubuntu-manual data volume.
# New installations use ../../deploy.sh and ../../docker-compose.yml.
services:
  ubuntu-wechat:
    image: ${WXBOT_IMAGE:-wxbot-wechat:ubuntu-24.04}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: wxbot-ubuntu-manual
    init: true
    restart: unless-stopped
    # 降"机器人/容器"指纹:真实主机名 + 真实网卡厂商 MAC(Intel OUI 00:1b:21),
    # 别再暴露容器 12 位哈希主机名与随机本地管理位 MAC。
    hostname: ${WXBOT_HOSTNAME:-ubuntu-pc}
    mac_address: ${WXBOT_MAC:-00:1b:21:3a:7c:9e}
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      SCREEN: ${SCREEN:-1920x1080x24}
      TZ: ${TZ:-Asia/Shanghai}
      WXBOT_BOT_AUTOSTART: ${WXBOT_BOT_AUTOSTART:-1}
      WXBOT_MEDIA_CAPTURE: ${WXBOT_MEDIA_CAPTURE:-1}
      WXBOT_NOVNC_URL: http://localhost:6082/vnc.html?autoconnect=true&resize=scale&view_only=false
      WXBOT_UI_AUTH: ${WXBOT_UI_AUTH:-1}
      WXBOT_UI_USER: ${WXBOT_UI_USER:-}
      WXBOT_UI_PASSWORD: ${WXBOT_UI_PASSWORD:-}
      WXBOT_SECRET: ${WXBOT_SECRET:-}
      WXBOT_UI_IDLE: ${WXBOT_UI_IDLE:-600}
    ports:
      - 127.0.0.1:5100:5100
      - 127.0.0.1:6082:6080
      - 127.0.0.1:5902:5900
    volumes:
      - ubuntu-wechat-home:/home/wechat
      - ../../accounts:/app/accounts

volumes:
  ubuntu-wechat-home:
    name: wxbot-ubuntu-manual-home
