# Compatibility entrypoint for the existing wxbot-ubuntu-manual data volume.
# New installations use ../../deploy.sh and ../../docker-compose.yml.
services:
  ubuntu-wechat:
    image: ${WXBOT_IMAGE:-wxbot-ubuntu-manual:24.04}
    build:
      context: ../..
      dockerfile: docker/ubuntu-manual/Dockerfile
    container_name: wxbot-ubuntu-manual
    init: true
    restart: unless-stopped
    # 降"机器人/容器"指纹:真实主机名 + 真实网卡厂商 MAC(Intel OUI 00:1b:21),
    # 别再暴露容器 12 位哈希主机名与随机本地管理位 MAC。
    hostname: ${WXBOT_HOSTNAME:-ubuntu-pc}
    mac_address: ${WXBOT_MAC:-00:1b:21:3a:7c:9e}
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    # This compatibility entrypoint is invoked from this subdirectory, so
    # Compose would otherwise ignore the repository-root .env on recreation.
    # Keep credentials and runtime settings in that one ignored file.
    env_file:
      - ../../.env
    environment:
      # Keep desktop startup alive even when the base image lost baked-in ENV
      # (for example after export/import). .env still supplies credentials.
      DISPLAY: ${DISPLAY:-:0}
      SCREEN: ${SCREEN:-1920x1080x24}
      TZ: ${TZ:-Asia/Shanghai}
      LANG: ${LANG:-zh_CN.UTF-8}
      LANGUAGE: ${LANGUAGE:-zh_CN:zh}
      LC_ALL: ${LC_ALL:-zh_CN.UTF-8}
      WXBOT_LOCAL: ${WXBOT_LOCAL:-1}
      WXBOT_BIND: ${WXBOT_BIND:-0.0.0.0}
      WXBOT_XWECHAT_ROOT: ${WXBOT_XWECHAT_ROOT:-/home/wechat/xwechat_files}
      WXBOT_LLM_CONFIG: ${WXBOT_LLM_CONFIG:-/home/wechat/llm_config.json}
      WXBOT_BOT_AUTOSTART: ${WXBOT_BOT_AUTOSTART:-0}
      WXBOT_MEDIA_CAPTURE: ${WXBOT_MEDIA_CAPTURE:-0}
      # 本容器会话 cookie。第二个微信容器启动时必须改成别的名字（例如 wxbot_second）。
      WXBOT_SESSION_COOKIE: ${WXBOT_SESSION_COOKIE:-wxbot_primary}
      # 可选：指向本容器自己的 secret 文件。空则继续用 .env 里的 WXBOT_SECRET。
      WXBOT_SECRET_FILE: ${WXBOT_SECRET_FILE:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - 127.0.0.1:5100:5100
      - 127.0.0.1:6082:6080
      - 127.0.0.1:5902:5900
    volumes:
      - ubuntu-wechat-home:/home/wechat
      - ../../accounts:/app/accounts
      - ../../output/ubuntu-manual-images:/home/wechat/Pictures

volumes:
  ubuntu-wechat-home:
    name: wxbot-ubuntu-manual-home
