# Compatibility entrypoint for the existing wxbot-ubuntu-manual data volume.
# New installations use ../../deploy.sh and ../../docker-compose.yml.
services:
  ubuntu-wechat:
    image: ${WXBOT_IMAGE:-wxbot-ubuntu-manual:24.04}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    container_name: wxbot-ubuntu-manual
    init: true
    restart: unless-stopped
    # 降"机器人/容器"指纹:真实主机名 + 真实网卡厂商 MAC(Intel OUI 00:1b:21),
    # 别再暴露容器 12 位哈希主机名与随机本地管理位 MAC。
    hostname: ${WXBOT_HOSTNAME:-ubuntu-pc}
    mac_address: ${WXBOT_MAC:-00:1b:21:3a:7c:9e}
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    cap_add:
      - SYS_PTRACE
    # This compatibility entrypoint is invoked from this subdirectory, so
    # Compose would otherwise ignore the repository-root .env on recreation.
    # Keep credentials and runtime settings in that one ignored file.
    env_file:
      - ../../.env
    ports:
      - 127.0.0.1:5100:5100
      - 127.0.0.1:6082:6080
      - 127.0.0.1:5902:5900
    volumes:
      - ubuntu-wechat-home:/home/wechat
      - ../../accounts:/app/accounts
      - ../../output/ubuntu-manual-images:/home/wechat/Pictures

volumes:
  ubuntu-wechat-home:
    name: wxbot-ubuntu-manual-home
