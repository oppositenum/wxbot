<style>:root{font:15px system-ui;color:#24362e;background:#f5f7f4}body{margin:0}main{max-width:760px;margin:auto;padding:32px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.7;color:#3d5148}a{color:#146b45}</style>
<main>
<div class="muted">本容器</div>
<h1>本容器账号</h1>
<p>这个页面只看本容器里的这个微信号。停止、重启别的号请到宿主机控制台，本页不能操作别的容器。</p>
<p><a id="console" href="http://127.0.0.1:5090/">打开宿主机控制台</a></p>
</main>
<script>
const host = location.hostname;
const name = host.includes(':') ? '[' + host + ']' : host;
if (name && name !== '0.0.0.0') {
  document.getElementById('console').href = 'http://' + name + ':5090/';
}
</script>
