<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信账号管理</title>
<style>:root{font:15px system-ui;color:#18231f;background:#f4f7f5}body{margin:0}main{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{font-size:30px;margin:0}.muted{color:#718078}button{padding:9px 14px;border:1px solid #bfd0c6;background:#fff;border-radius:8px;cursor:pointer}button.primary{background:#176b46;color:#fff;border-color:#176b46}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.account{background:#fff;border:1px solid #dbe6df;border-radius:14px;padding:18px;box-shadow:0 4px 18px #173b2810}.name{font-weight:700;font-size:18px}.id{font:12px ui-monospace;color:#718078;margin-top:4px}.line{display:flex;justify-content:space-between;margin:16px 0 14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9aa9a1;margin-right:7px}.dot.ok{background:#18a66a}.dot.warn{background:#e19b28}.meta{color:#61736a;font-size:13px;line-height:1.8}.card-actions{display:flex;gap:7px;margin-top:14px}.empty{padding:40px;text-align:center;color:#718078;background:#fff;border-radius:14px}dialog{border:0;border-radius:14px;padding:22px;box-shadow:0 15px 60px #173b2840}input{padding:9px;border:1px solid #bfd0c6;border-radius:7px;width:240px}</style>
<main><form id="authForm" class="toolbar" style="flex-wrap:wrap" autocomplete="off"><label for="adminToken">管理员 Token</label><input id="adminToken" type="password" autocomplete="off" placeholder="与画像管理使用相同的 Token"><button class="primary" id="authorize" type="submit">授权并加载</button><button id="logout" type="button" hidden>退出授权</button></form><p id="authStatus" class="muted" role="status">请输入管理员 Token。仅保留在当前页面内存，刷新后需重新输入。</p><p id="error" role="alert" style="color:#a33232"></p><div class="top"><div><div class="muted">运营控制台 / 多账号</div><h1>微信账号管理</h1><p class="muted">每个账号独立运行一套微信、后台、数据卷与 VNC 入口。</p></div><div><button id="refresh">刷新状态</button><button class="primary" id="add">添加微信号</button></div></div><div class="toolbar"><span id="summary" class="muted"></span><button id="startAll">启动已启用账号</button><button id="stopAll">停止全部账号</button></div><div id="grid" class="grid"></div></main>
<dialog id="dlg"><form method="dialog"><h3>添加微信号</h3><p><input id="label" required maxlength="100" placeholder="例如：客服号 / 内容号"></p><p class="muted">创建后分配独立容器和端口，首次使用需在该账号的 VNC 页面扫码登录。</p><button value="cancel">取消</button> <button id="create" class="primary" value="default">创建</button></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let token='',authorized=false,loading=false;
function lock(){authorized=false;$('#grid').replaceChildren();$('#summary').textContent='';for(const id of ['refresh','add','startAll','stopAll'])$('#'+id).disabled=true;$('#logout').hidden=true;}
function unlock(){authorized=true;for(const id of ['refresh','add','startAll','stopAll'])$('#'+id).disabled=false;$('#logout').hidden=false;}
function report(e){$('#error').textContent=e.message;}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...opt.headers,'X-Wxbot-Admin-Token':token,'X-Wxbot-Local-Admin':'1'}});let d=await r.json();if(r.status===403){lock();token='';$('#authStatus').textContent='授权失效或 Token 不正确，请重新输入。';}if(!r.ok||d.error||d.ok===false)throw Error(d.error||d.reason||'请求失败');return d}
function draw(xs){$('#summary').textContent=`共 ${xs.length} 个账号 · 在线状态以各账号后台登录结果为准`;$('#grid').innerHTML=xs.length?xs.map(a=>{let s=a.status||{},ok=s.running;return `<section class="account"><div class="name"><span class="dot ${ok?'ok':'warn'}"></span>${esc(a.label)}</div><div class="id">${esc(a.id)}</div><div class="line"><b>${ok?'运行中':'已停止'}</b><span>${a.enabled===false?'已停用':'已启用'}</span></div><div class="meta">容器：${esc(a.container)}<br>后台：http://127.0.0.1:${a.web_port}<br>VNC：http://127.0.0.1:${a.vnc_port}/vnc.html<br>微信登录：${s.online?'在线':'需进入后台确认'}</div><div class="card-actions"><button data-a="${esc(a.id)}" data-op="start">启动</button><button data-a="${esc(a.id)}" data-op="restart">重启</button><button data-a="${esc(a.id)}" data-op="stop">停止</button></div></section>`}).join(''):'<div class="empty">还没有账号。先添加一个微信号，系统会为它分配独立运行环境。</div>';document.querySelectorAll('[data-op]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/accounts/'+encodeURIComponent(b.dataset.a)+'/'+b.dataset.op,{method:'POST'});await load()}catch(e){report(e)}finally{b.disabled=false}})}
async function load(){if(!authorized||loading)return;loading=true;try{draw((await api('/api/accounts')).accounts);$('#error').textContent='';}catch(e){report(e)}finally{loading=false;}}
$('#refresh').onclick=load;$('#add').onclick=()=>$('#dlg').showModal();$('#create').onclick=async e=>{e.preventDefault();try{await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:$('#label').value})});$('#dlg').close();$('#label').value='';await load()}catch(x){report(x)}};$('#startAll').onclick=async()=>{try{const result=await api('/api/accounts/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})});if(result.results?.some(r=>r.ok===false))throw Error('部分账号启动失败，请检查宿主管理服务是否可用。');await load()}catch(e){report(e)}};$('#stopAll').onclick=async()=>{if(confirm('停止全部账号环境？')){try{const result=await api('/api/accounts/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'stop'})});if(result.results?.some(r=>r.ok===false))throw Error('部分账号停止失败，请检查宿主管理服务是否可用。');await load()}catch(e){report(e)}}};
$('#authForm').onsubmit=async e=>{e.preventDefault();if(loading)return;token=$('#adminToken').value.trim();$('#adminToken').value='';$('#error').textContent='';if(!token){lock();$('#error').textContent='请输入管理员 Token';return;}loading=true;$('#authorize').disabled=true;try{const data=await api('/api/accounts');unlock();draw(data.accounts);$('#authStatus').textContent='已授权。Token 仅在当前页面内存中保存。';}catch(e){lock();token='';report(e);}finally{loading=false;$('#authorize').disabled=false;}};
$('#logout').onclick=()=>{token='';$('#adminToken').value='';lock();$('#dlg').close();$('#authStatus').textContent='已退出授权';};
lock();setInterval(()=>{if(authorized)load()},15000);
</script></html>
