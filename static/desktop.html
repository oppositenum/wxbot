<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微信桌面 · wxbot 管理后台</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;color:#202b25;background:#f5f7f6}
header{padding:14px 22px;background:white;border-bottom:1px solid #dde4df;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}select,button,a.action{font:inherit;border:1px solid #cdd8d0;border-radius:6px;padding:6px 12px;background:white;color:inherit;text-decoration:none}select,button{cursor:pointer}a.primary{background:#078c49;color:white;border-color:#078c49}.actions{display:flex;gap:8px;margin-left:auto}.status{padding:9px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #e1e7e3}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b0b9b3;margin-right:6px}.dot.ok{background:#07a85a}.muted{color:#647269}#error{color:#ad3c27}main{flex:1;min-height:240px;position:relative;background:#1c252d}iframe{width:100%;height:100%;border:0;display:block}footer{padding:9px 22px;font-size:12px;color:#526159;background:white}footer strong{font-weight:600;color:#2e4135}.tip{color:#647269}#empty{padding:40px;color:white;text-align:center}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #88d7ad;outline-offset:2px}@media(max-width:720px){header{padding:10px;gap:8px}.actions{margin-left:0}.status,footer{padding:8px 10px}.tip{display:none}}
</style>
</head>
<body>
<header>
  <h1>微信桌面</h1>
  <label>当前实例 <select id="instance" aria-label="选择微信实例" disabled></select></label>
  <span class="muted" id="system"></span>
  <div class="actions"><button id="refresh">刷新状态</button><button id="reconnect">重新连接桌面</button><a class="action primary" id="open" target="_blank" rel="noopener">独立窗口打开</a></div>
</header>
<div class="status" aria-live="polite">
  <span id="running">正在连接后台…</span><span class="muted">登录状态以桌面中的微信为准</span><span id="error" role="status"></span>
</div>
<main id="surface"><div id="empty">正在加载微信桌面…</div></main>
<footer><strong>手动控制 · 自动回复已关闭</strong>　可直接在上方微信中聊天和发送图片。<br>
  <span id="files"></span><span class="tip"> 后台联系人、消息同步和自动发送尚未接入；切换实例只切换所查看的桌面。</span>
</footer>
<script>
const $=id=>document.getElementById(id);
let profiles=[],selected=null,generation=0,busy=false;
async function refreshStatus(){
  if(!selected||busy)return;
  busy=true;const id=selected.id,version=generation;
  try{
    const response=await fetch('/api/desktop/status?instance='+encodeURIComponent(id),{cache:'no-store'});
    if(!response.ok)throw new Error('后台状态读取失败');
    const state=await response.json();
    if(version!==generation)return;
    $('running').replaceChildren();
    const dot=document.createElement('span');dot.className='dot'+(state.wechat_running?' ok':'');
    $('running').append(dot,document.createTextNode(state.wechat_running?'微信运行中':state.container_running?'桌面已启动 · 微信未运行':'桌面未运行'));
    $('error').textContent=state.error||'';
  }catch(error){if(version===generation){$('running').textContent='无法获取状态';$('error').textContent=error.message;}}
  finally{busy=false;}
}
function connect(){
  const frame=document.createElement('iframe');frame.title=selected.name+'远程桌面';frame.src=selected.desktop_url;frame.allow='fullscreen';
  $('surface').replaceChildren(frame);
}
function select(id){
  selected=profiles.find(p=>p.id===id)||profiles[0];generation++;
  $('instance').value=selected.id;$('system').textContent=selected.system;
  $('open').href=selected.desktop_url;$('error').textContent='';$('running').textContent='正在读取实例状态…';
  $('files').textContent=selected.id==='ubuntu'?'测试图片：Home → Pictures → pelican-original.png。':'';
  try{sessionStorage.setItem('wxbot.desktop.instance',selected.id);}catch(e){}
  connect();refreshStatus();
}
$('instance').onchange=()=>select($('instance').value);
$('refresh').onclick=refreshStatus;
$('reconnect').onclick=()=>{if(selected)connect();};
(async()=>{
  try{
    const response=await fetch('/api/desktop/instances',{cache:'no-store'});if(!response.ok)throw new Error('实例列表读取失败');
    const data=await response.json();profiles=data.instances;
    for(const p of profiles){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;$('instance').append(option);}
    let id=data.default_instance;try{id=sessionStorage.getItem('wxbot.desktop.instance')||id;}catch(e){}
    $('instance').disabled=false;select(id);
  }catch(error){$('running').textContent='后台连接失败';$('empty').textContent=error.message;}
})();
setInterval(()=>{if(!document.hidden)refreshStatus();},10000);
</script>
</body>
</html>
