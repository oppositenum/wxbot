<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直发测试</title><link rel="stylesheet" href="/static/nav.css">
<style>
:root{font:15px system-ui;color:#24362e;background:#f5f7f4}body{margin:0}main{max-width:1100px;margin:auto;padding:28px}
h1{font-size:28px;margin:0 0 4px}.muted{color:#718078}h2{font-size:17px;margin:0 0 10px}
input,textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #bfd0c6;border-radius:10px;font:15px system-ui;background:#fff}
textarea{min-height:130px;resize:vertical}
.grid{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px;margin-top:16px}
.card{background:#fff;border:1px solid #e4ece7;border-radius:14px;padding:16px}
#list{max-height:62vh;overflow:auto;margin-top:8px}
.row{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#f2f7f4}.row.sel{background:#e6f4ec;border-color:#9fd0b4}
.row .who{flex:1;min-width:0}.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id{font:12px ui-monospace;color:#8a978f;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;border-radius:20px;padding:2px 8px;background:#eaf5ef;color:#23815a;white-space:nowrap}
.tag.group{background:#eef3fb;color:#2a5db0}
button{padding:9px 16px;border:1px solid #bfd0c6;background:#fff;border-radius:9px;cursor:pointer;white-space:nowrap;font:15px system-ui}
button.primary{background:#23815a;color:#fff;border-color:#23815a}button:disabled{opacity:.5;cursor:not-allowed}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.pill{font-size:13px;border-radius:20px;padding:3px 10px;background:#eef1ef;color:#55635b}
.pill.ok{background:#e3f4ea;color:#1d7a50}.pill.bad{background:#fbe9e9;color:#a33232}
.target{padding:10px 12px;border-radius:10px;background:#f5f8f6;margin-bottom:10px}
.actions{display:flex;gap:10px;align-items:center;margin-top:10px}
#result{font-size:14px}#result.ok{color:#1d7a50}#result.bad{color:#a33232}
.hist{border-top:1px solid #eef2ef;padding:8px 0;font-size:14px}
.hist .meta{display:flex;gap:8px;color:#718078;font-size:12px}
.hist .text{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.warn{background:#fff7e6;border:1px solid #f1dcae;color:#7a5a12;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.empty{color:#718078;padding:12px 4px}
.mode{margin-top:16px}.mode .opts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.mode label.opt{flex:1;min-width:220px;border:1px solid #d6e2db;border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}
.mode label.opt.on{border-color:#23815a;background:#eef8f2}.mode label.opt b{display:block}
.mode .sub{font-size:13px;color:#718078}.bot{font-size:12px;border-radius:20px;padding:1px 7px;background:#f3ecfb;color:#6a3fa0}
.preview{display:none;align-items:center;gap:10px;margin-top:10px;padding:8px;border:1px dashed #bfd0c6;border-radius:10px}
.preview img{max-width:120px;max-height:90px;border-radius:6px}.preview .fn{flex:1;min-width:0;font-size:13px;color:#55635b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:820px){main{padding:18px 12px}.grid{grid-template-columns:1fr}#list{max-height:40vh}}
</style>
<main>
<h1>直发测试</h1>
<p class="muted">直接调用微信底层发送，不操作界面。<b>独立测试功能</b>，不影响机器人现有的发送方式。</p>
<div class="status" id="status"><span class="pill">检查中…</span></div>
<section class="card mode">
  <h2>机器人回复发送方式</h2>
  <div class="opts">
    <label class="opt" id="opt-ui"><input type="radio" name="mode" value="ui"> <b>界面自动化（原有）</b><span class="sub">搜索联系人、粘贴、回车，和人工操作一样</span></label>
    <label class="opt" id="opt-direct"><input type="radio" name="mode" value="direct"> <b>直发（实验）</b><span class="sub">直接调用微信底层发送，不操作界面，更快</span></label>
  </div>
  <label class="sub"><input type="checkbox" id="fallback"> 直发确定没发出时（未连接、未登录等）自动改用界面自动化；结果不确定时不回退，避免重复发送</label>
  <div class="sub" id="modeMsg" style="margin-top:6px"></div>
</section>
<div class="warn">支持文字和图片（PNG / JPG / GIF / WEBP，20MB 以内）。「已交给微信发送」只代表微信已接收；图片要等微信后台上传完才算真正发出，是否送达请在手机或 VNC 里看有没有红色感叹号。</div>
<div class="grid">
  <section class="card">
    <h2>选择好友或群</h2>
    <input id="q" placeholder="搜索名字或微信号">
    <div id="list"><p class="empty">加载中…</p></div>
  </section>
  <section>
    <div class="card">
      <h2>消息</h2>
      <div class="target" id="target"><span class="muted">先在左边选一个好友或群</span></div>
      <textarea id="content" placeholder="输入要发送的文字，可直接粘贴截图（Ctrl/⌘ + Enter 发送）" maxlength="2000"></textarea>
      <div class="preview" id="preview"><img id="pimg" alt=""><span class="fn" id="pname"></span><button type="button" id="premove">移除</button></div>
      <div class="actions"><button class="primary" id="send" disabled>发送</button><button type="button" id="pick" title="音频会转成带声波画面的视频发出(Linux 版微信发不了语音条)">选择图片/视频/音频</button><button type="button" id="revoke" disabled title="撤回我在这个会话里最近发的一条(2 分钟内)">撤回上一条</button><input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/quicktime,audio/*,.mp3,.m4a,.wav,.ogg,.flac,.amr" hidden><span id="result"></span></div>
    </div>
    <div class="card" style="margin-top:18px">
      <h2>发送记录</h2>
      <div id="history"><p class="empty">还没有记录</p></div>
    </div>
  </section>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let rows=[], sel=null, sending=false, ready=false, image=null;
async function j(url,opt){const r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));let d={};try{d=await r.json();}catch(e){}if(r.status===401){location.replace('/login');}return [r,d];}
function pill(text,cls){return `<span class="pill ${cls||''}">${esc(text)}</span>`;}
async function loadStatus(){
  const [r,d]=await j('/api/direct/status');
  const p=[];
  if(!r.ok){$('#status').innerHTML=pill('状态读取失败','bad');ready=false;return upd();}
  p.push(d.supported?pill('微信 '+d.version,'ok'):pill(d.sha256?'微信版本未适配':'找不到微信','bad'));
  p.push(d.attached?pill('已连接 PID '+d.pid,'ok'):pill('未连接','bad'));
  p.push(d.logged_in?pill('已登录','ok'):pill('未登录','bad'));
  if(d.error)p.push(`<span class="muted" style="font-size:13px">${esc(d.error)}</span>`);
  $('#status').innerHTML=p.join('');
  ready=!!(d.attached&&d.logged_in);upd();
}
function upd(){$('#send').disabled=!(ready&&sel&&!sending&&($('#content').value.trim()||image));$('#revoke').disabled=!(ready&&sel&&!sending);}
function setImage(f){
  const vid=!!f&&/^video\/(mp4|quicktime)$/.test(f.type);
  const aud=!!f&&(/^audio\//.test(f.type)||/\.(mp3|m4a|wav|ogg|flac|amr)$/i.test(f.name||''));
  if(f&&!vid&&!aud&&!/^image\/(png|jpeg|gif|webp)$/.test(f.type)){$('#result').className='bad';$('#result').textContent='✗ 只支持图片、MP4/MOV 视频或 MP3/M4A/WAV 等音频';return;}
  if(f&&f.size>(vid?25:20)*1024*1024){$('#result').className='bad';$('#result').textContent=vid?'✗ 视频超过 25MB':'✗ 文件超过 20MB';return;}
  if($('#pimg').src)URL.revokeObjectURL($('#pimg').src);
  image=f||null;
  if(image){if(vid||aud)$('#pimg').removeAttribute('src');else $('#pimg').src=URL.createObjectURL(image);$('#pname').textContent=(vid?'🎬 ':aud?'🔊 ':'')+(image.name||'粘贴的图片')+' · '+Math.ceil(image.size/1024)+' KB';$('#preview').style.display='flex';}
  else{$('#pimg').removeAttribute('src');$('#preview').style.display='none';$('#file').value='';}
  upd();
}
function draw(){
  const q=$('#q').value.trim().toLowerCase();
  const shown=rows.filter(r=>(r.to+' '+r.chat).toLowerCase().includes(q)).slice(0,300);
  $('#list').innerHTML=shown.length?shown.map((r,i)=>`<div class="row ${sel&&sel.chat===r.chat?'sel':''}" data-i="${i}"><span class="tag ${r.kind==='群'?'group':''}">${esc(r.kind)}</span><div class="who"><div class="name">${esc(r.to)}</div><div class="id">${esc(r.chat)}</div></div></div>`).join(''):'<p class="empty">没有匹配的人或群</p>';
  document.querySelectorAll('#list .row').forEach(el=>el.onclick=()=>{sel=shown[+el.dataset.i];pick();draw();});
}
function pick(){
  $('#target').innerHTML=sel?`<span class="tag ${sel.kind==='群'?'group':''}">${esc(sel.kind)}</span> <b>${esc(sel.to)}</b><div class="id">${esc(sel.chat)}</div>`:'<span class="muted">先在左边选一个好友或群</span>';
  $('#result').textContent='';upd();$('#content').focus();
}
function fmt(t){const d=new Date(t*1000);return d.toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});}
async function loadHistory(){
  const [r,d]=await j('/api/direct/history');
  const h=(r.ok&&d.history)||[];
  $('#history').innerHTML=h.length?h.map(x=>`<div class="hist"><div class="meta"><span>${fmt(x.t)}</span>${x.source==='bot'?'<span class="bot">🤖 机器人</span>':''}<span>${esc(x.name||x.chat)}</span><span style="color:${x.ok?'#1d7a50':'#a33232'}">${x.ok?(x.kind==='revoke'?'✓ 已撤回':'✓ 已交给微信'):'✗ '+esc(x.error||'失败')}</span></div><div class="text">${x.kind==='image'?'🖼️ 图片 · ':x.kind==='video'?'🎬 视频 · ':x.kind==='revoke'?'↩️ 撤回 · ':''}${esc(x.content)}</div></div>`).join(''):'<p class="empty">还没有记录</p>';
}
async function post(url,body){
  const opt={method:'POST'};
  if(body instanceof FormData)opt.body=body;else{opt.headers={'content-type':'application/json'};opt.body=JSON.stringify(body);}
  const [r,d]=await j(url,opt);
  if(!(r.ok&&d.ok))throw Error(d.error||'发送失败');
  return d;
}
async function doSend(){
  if($('#send').disabled)return;
  const content=$('#content').value, img=image, target=sel;
  sending=true;upd();$('#result').className='';$('#result').textContent='发送中…';
  const done=[];
  try{
    if(img){
      const fd=new FormData();fd.append('chat',target.chat);fd.append('name',target.to);fd.append('file',img,img.name||'paste.png');
      await post('/api/direct/send_image',fd);done.push(img.type.startsWith('video/')?'视频':(img.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|amr)$/i.test(img.name||''))?'语音':'图片');setImage(null);
    }
    if(content.trim()){
      await post('/api/direct/send',{chat:target.chat,name:target.to,content});done.push('文字');$('#content').value='';
    }
    $('#result').className='ok';$('#result').textContent='✓ '+done.join('和')+'已交给微信发送';
  }catch(e){
    $('#result').className='bad';$('#result').textContent=(done.length?'✓ '+done.join('和')+'已发；':'')+'✗ '+(e.message||'网络错误');
  }
  sending=false;upd();loadHistory();loadStatus();
}
$('#pick').onclick=()=>$('#file').click();
$('#revoke').onclick=async()=>{
  if($('#revoke').disabled)return;
  const target=sel;
  if(!confirm('撤回我发给「'+(target.to||target.chat)+'」的最近一条消息？只能撤 2 分钟内的。'))return;
  sending=true;upd();$('#result').className='';$('#result').textContent='撤回中…';
  try{await post('/api/direct/revoke',{chat:target.chat,name:target.to});$('#result').className='ok';$('#result').textContent='✓ 已撤回';}
  catch(e){$('#result').className='bad';$('#result').textContent='✗ '+(e.message||'网络错误');}
  sending=false;upd();loadHistory();
};
$('#file').onchange=e=>setImage(e.target.files[0]);
$('#premove').onclick=()=>setImage(null);
$('#content').addEventListener('paste',e=>{
  const it=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.kind==='file'&&x.type.startsWith('image/'));
  if(it){e.preventDefault();setImage(it.getAsFile());}
});
$('#q').oninput=draw;
$('#content').oninput=upd;
$('#content').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();doSend();}};
$('#send').onclick=doSend;
Promise.all([j('/api/contacts'),j('/api/groups')]).then(([[r1,people],[r2,groups]])=>{
  if(!r1.ok)throw Error(people.error||'加载失败');
  const name=x=>x.name||x.username;
  rows=(people||[]).map(p=>({kind:'私聊',to:name(p),chat:p.username}))
    .concat((r2.ok&&Array.isArray(groups)?groups:[]).map(g=>({kind:'群',to:name(g),chat:g.username})))
    .filter(r=>r.to&&r.chat);
  const fh=rows.findIndex(x=>x.chat==='filehelper');
  if(fh>0)rows.unshift(rows.splice(fh,1)[0]);
  draw();
}).catch(e=>{$('#list').innerHTML=`<p class="empty">${esc(e.message)}</p>`;});
async function loadMode(){
  const [r,d]=await j('/api/send_mode');
  if(!r.ok){$('#modeMsg').textContent='读取失败';return;}
  document.querySelectorAll('input[name=mode]').forEach(x=>x.checked=x.value===d.mode);
  $('#opt-ui').classList.toggle('on',d.mode==='ui');$('#opt-direct').classList.toggle('on',d.mode==='direct');
  $('#fallback').checked=!!d.fallback;
  $('#modeMsg').textContent='当前：'+(d.mode==='direct'?'直发':'界面自动化')+(d.updated?' · 修改于 '+fmt(d.updated):'');
}
async function saveMode(body){
  $('#modeMsg').textContent='保存中…';
  const [r,d]=await j('/api/send_mode',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){$('#modeMsg').textContent='✗ '+(d.error||'保存失败');}
  loadMode();
}
document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=()=>saveMode({mode:x.value}));
$('#fallback').onchange=e=>saveMode({fallback:e.target.checked});
loadMode();loadStatus();loadHistory();setInterval(loadStatus,15000);setInterval(loadHistory,15000);
</script>
<script src="/static/nav.js"></script></html>
