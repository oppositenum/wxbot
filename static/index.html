<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wxbot 微信后台</title>
<style>
  :root { --bg:#f5f6f7; --panel:#fff; --line:#e4e6eb; --brand:#07c160; --muted:#8a8f99; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC",sans-serif; background:var(--bg); color:#1d1f23; }
  header { flex-wrap:wrap; display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
  .ok{background:var(--brand)} .bad{background:#e0554e} .warn{background:#e6a23c}
  .pill { background:#f0f1f3; border-radius:12px; padding:3px 10px; font-size:12px; color:#555; }
  button { font:inherit; border:none; border-radius:6px; padding:6px 12px; cursor:pointer; background:#eaecef; }
  button.primary { background:var(--brand); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  body { height:100vh; display:flex; flex-direction:column; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:300px 1fr; height:auto; }
  .side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs div { flex:1; text-align:center; padding:9px; cursor:pointer; color:var(--muted); }
  .tabs div.active { color:#1d1f23; border-bottom:2px solid var(--brand); font-weight:600; }
  .search { padding:8px; border-bottom:1px solid var(--line); }
  .search input { width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:6px; }
  .list { overflow-y:auto; flex:1; }
  .row { display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer; border-bottom:1px solid #f2f3f5; }
  .row:hover { background:#f7f8fa; }
  .row.active { background:#eaf7ef; }
  .avatar { width:36px; height:36px; border-radius:6px; background:#dcdfe4; flex:none; object-fit:cover; }
  .row .name { font-weight:500; }
  .row .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
  .badge { flex:none; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:#fa5151; color:#fff; font-size:11px; line-height:18px; text-align:center; box-sizing:border-box; }
  .tabs .cnt { display:inline-block; min-width:15px; height:15px; padding:0 4px; margin-left:3px; border-radius:8px; background:#fa5151; color:#fff; font-size:10px; line-height:15px; vertical-align:middle; }
  .content { display:flex; flex-direction:column; overflow:hidden; }
  .chat-head { padding:11px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; justify-content:space-between; align-items:center; }
  .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { display:flex; gap:8px; max-width:72%; }
  .msg .bubble { background:#fff; padding:8px 11px; border-radius:8px; box-shadow:0 1px 1px rgba(0,0,0,.05); word-break:break-word; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .msg.self { align-self:flex-end; flex-direction:row-reverse; }
  .msg.self .bubble { background:#95ec69; }
  .msg .refer { border-left:2px solid #ccc; padding-left:6px; margin-top:4px; color:#666; font-size:12px; }
  .msg .time { font-size:10px; color:#b0b4bb; margin-top:3px; }
  .composer { border-top:1px solid var(--line); background:var(--panel); padding:10px 14px; display:flex; gap:8px; align-items:center; }
  .composer input[type=text] { flex:1; padding:9px; border:1px solid var(--line); border-radius:6px; }
  .empty { color:var(--muted); text-align:center; margin-top:40px; }
  .members { position:fixed; right:0; top:53px; bottom:0; width:280px; background:#fff; border-left:1px solid var(--line); box-shadow:-4px 0 12px rgba(0,0,0,.06); overflow-y:auto; padding:12px; display:none; }
  .members.show { display:block; }
  .members h3 { margin:4px 0 10px; font-size:14px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:9px 16px; border-radius:8px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:.95; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:1000; cursor:zoom-out; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:92%; max-height:92%; border-radius:4px; box-shadow:0 4px 30px rgba(0,0,0,.5); }
</style>
</head>
<body>
<header>
  <h1>wxbot 微信后台</h1>
  <span class="pill" id="loginState">加载中…</span>
  <span class="pill" id="keyState"></span>
  <span class="pill" id="syncState"></span>
  <button id="loginBtn">扫码登录(noVNC)</button>
  <button id="keyBtn">刷新密钥</button>
  <button id="imgKeyBtn" title="切换微信账号后,注入抓取该账号的图片解密密钥">抓图片密钥</button>
  <button id="syncBtn">立即同步</button>
  <button id="botBtn">机器人：…</button>
  <button id="aiBtn">蒸馏/AI</button>
  <button id="personalizationBtn" class="primary">画像与人设</button>
  <button id="watchBtn">监听设置</button>
  <button id="adminBtn">管理员设置</button>
  <button id="followBtn">跟发设置</button>
  <button id="pushBtn">监听推送</button>
  <button id="scheduleBtn">定时任务</button>
  <button id="accountsBtn">多账号管理</button>
  <button onclick="location.href='/moments'">朋友圈</button>
  <button id="configExportBtn">导出配置</button>
  <button id="configImportBtn">导入配置</button><input id="configImportFile" type="file" accept=".zip" hidden>
  <span class="pill" id="mediaState">媒体：连接中</span>
</header>
<main>
  <div class="side">
    <div class="tabs">
      <div data-tab="sessions" class="active">会话</div>
      <div data-tab="contacts">联系人</div>
      <div data-tab="groups">群聊</div>
      <div data-tab="other">其他</div>
    </div>
    <div class="search"><input id="filter" placeholder="过滤…"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="content">
    <div class="chat-head">
      <span id="chatTitle">未选择会话</span>
      <span style="display:flex;gap:8px">
        <button id="harvestBtn" style="display:none" title="重新检查已经接收到本地的媒体文件">更新媒体</button>
        <button id="membersBtn" style="display:none">群成员</button>
      </span>
    </div>
    <div class="msgs" id="msgs"><div class="empty">选择左侧会话查看消息</div></div>
    <div class="composer">
      <input type="text" id="msgInput" placeholder="输入文本，回车发送…" disabled>
      <input type="file" id="imgInput" accept="image/*" style="display:none">
      <button id="imgBtn" disabled>图片</button>
      <button class="primary" id="sendBtn" disabled>发送</button>
    </div>
  </div>
</main>
<div class="members" id="membersPanel"></div>
<div class="members" id="aiPanel" style="width:340px"></div>
<div class="members" id="watchPanel" style="width:340px"></div>
<div class="members" id="adminPanel" style="width:360px"></div>
<div class="members" id="followPanel" style="width:340px"></div>
<div class="members" id="pushPanel" style="width:380px"></div>
<div class="members" id="schedulePanel" style="width:380px"></div>
<div id="personalizationPane" hidden style="position:fixed;inset:0;z-index:900;background:var(--bg)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:white;border-bottom:1px solid var(--line)"><strong>联系人画像与专属人设</strong><button id="closePersonalization">返回聊天</button></div>
  <iframe id="personalizationFrame" title="联系人画像与专属人设管理" style="width:100%;flex:1;min-height:0;border:0"></iframe>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lightboxImg" src=""></div>

<script>
const $ = s => document.querySelector(s);
let tab = "sessions", data = {sessions:[],contacts:[],groups:[],other:[]}, current = null, lastMsgs = [];
document.addEventListener('DOMContentLoaded',()=>{const b=document.querySelector('#accountsBtn');if(b)b.onclick=()=>{location.href='/accounts';};});

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts*1000); return d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function avatarURL(u){ return "/api/avatar?username="+encodeURIComponent(u); }

let NOVNC="http://localhost:6080/vnc.html";
let imgReady=false;
async function loadStatus(){
  try{
    const s = await (await fetch("/api/status")).json();
    NOVNC = s.novnc_url || NOVNC;
    imgReady = !!s.img_ready;
    $("#loginState").innerHTML = `<span class="dot ${s.logged_in?'ok':(s.container_running?'warn':'bad')}"></span>`
      + (s.logged_in ? ("小号已登录 "+(s.logged_in_wxid||"")) : (s.container_running?"容器在跑·未登录":"容器未运行"));
    $("#keyState").innerHTML = `<span class="dot ${s.keys_ready?'ok':'warn'}"></span>`
      + (s.keys_ready ? "密钥就绪" : "缺密钥(点刷新密钥)");
    $("#syncState").innerHTML = `<span class="dot ${s.decrypted_ready?'ok':'warn'}"></span>`
      + (s.decrypted_ready ? ("上次同步 "+(s.last_sync?fmtTime(s.last_sync):"—")) : "未解密");
  }catch(e){ $("#loginState").textContent="后台连接失败"; }
}

async function loadTab(t){
  if(t==="sessions"||t==="other"){        // 会话 与 其他 共用 /api/sessions，按 category 分流
    const r = await fetch("/api/sessions");
    if(!r.ok){ const e=await r.json(); toast(e.error||"加载失败"); data.sessions=[]; data.other=[]; render(); return; }
    const all = await r.json();
    data.sessions = all.filter(x=>x.category!=="other");   // 私聊+群聊
    data.other    = all.filter(x=>x.category==="other");   // 公众号/服务号/系统
    render(); return;
  }
  const ep = {contacts:"/api/contacts",groups:"/api/groups"}[t];
  const r = await fetch(ep);
  if(!r.ok){ const e=await r.json(); toast(e.error||"加载失败"); data[t]=[]; render(); return; }
  data[t] = await r.json();
  render();
}

function itemName(t,x){
  if(t==="sessions") return x.username;
  return x.name || x.username;
}
function render(){
  const f = $("#filter").value.trim();
  const list = $("#list"); list.innerHTML="";
  let items = data[tab]||[];
  if(f) items = items.filter(x=> JSON.stringify(x).includes(f));
  for(const x of items){
    const u = x.username;
    const name = x.name || x.username;
    const sub = (tab==="sessions"||tab==="other") ? (x.summary||"") : (x.member_count!=null?("成员 "+x.member_count):(x.remark||x.nick_name||x.username||""));
    const src = x.head_url || avatarURL(u);
    const div = document.createElement("div");
    div.className="row"+(current&&current.username===u?" active":"");
    const unread = x.unread || 0;
    const badge = unread > 0 ? `<div class="badge">${unread>99?'99+':unread}</div>` : "";
    const greetBtn = (tab==="sessions") ? `<button class="greetBtn" title="AI按上下文打个招呼" style="border:none;background:none;font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0">👋</button>` : "";
    div.innerHTML = `<img class="avatar" src="${src}" onerror="this.onerror=null;this.src='${avatarURL(u)}'">
      <div style="min-width:0;flex:1"><div class="name">${escape_(name)}</div><div class="sub">${escape_(sub)}</div></div>${greetBtn}${badge}`;
    div.onclick = ()=> openChat({username:u, name, is_group:u.endsWith("@chatroom")});
    const gb = div.querySelector(".greetBtn");
    if(gb) gb.onclick = async (e)=>{
      e.stopPropagation();
      if(gb.disabled) return;
      gb.disabled = true; gb.textContent = "⏳";
      toast("AI 生成打招呼并发送中…");
      try{
        const r = await (await fetch("/api/greet",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat:u})})).json();
        toast(r.ok ? ((r.verified?"已确认发送: ":"已提交微信: ")+(r.message||"").slice(0,30)) : ((r.status==="uncertain"?"待核对: ":"未发送: ")+(r.message||r.reason||"请求未完成")));
      }catch(err){ toast("打招呼出错: "+err); }
      gb.disabled = false; gb.textContent = "👋";
    };
    list.appendChild(div);
  }
  updateTabBadges();
}
function updateTabBadges(){
  const sum = arr => (arr||[]).reduce((a,x)=>a+(x.unread||0),0);
  const set = (t,label,n)=>{ const el=document.querySelector('.tabs div[data-tab="'+t+'"]');
    if(el) el.innerHTML = label + (n>0?'<span class="cnt">'+(n>99?'99+':n)+'</span>':''); };
  set("sessions","会话",sum(data.sessions));
  set("other","其他",sum(data.other));
}
async function refreshSessions(){   // 定时刷未读数(即使当前不在会话tab也更新角标)
  try{
    const all = await (await fetch("/api/sessions")).json();
    if(!Array.isArray(all)) return;
    data.sessions = all.filter(x=>x.category!=="other");
    data.other    = all.filter(x=>x.category==="other");
    updateTabBadges();
    if(tab==="sessions"||tab==="other") render();
  }catch(e){}
}
function escape_(s){ return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function showImg(u){ $("#lightboxImg").src=u; $("#lightbox").classList.add("show"); }

async function openChat(chat){
  current = chat;
  $("#chatTitle").textContent = chat.name || chat.username;
  $("#msgInput").disabled=false; $("#sendBtn").disabled=false; $("#imgBtn").disabled=false;
  $("#membersBtn").style.display = chat.is_group ? "" : "none";
  $("#harvestBtn").style.display = "";
  render();
  await loadMessages(true);   // 打开会话：强制滚到最新(底部)
}

$("#harvestBtn").onclick=async()=>{
  if(!current) return;
  const button=$("#harvestBtn"); button.disabled=true;
  try{
    const response=await fetch('/api/media/refresh',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat:current.username})});
    if(!response.ok) throw new Error('更新失败');
    toast('正在检查已接收的媒体'); await loadMessages();
  }catch(e){toast('媒体暂时无法更新');}
  finally{button.disabled=false;}
};

async function loadMessages(force){
  if(!current) return;
  const selected = current;
  const box = $("#msgs");
  const atBottom = force || (box.scrollHeight-box.scrollTop-box.clientHeight < 60);
  const r = await fetch("/api/messages?chat="+encodeURIComponent(current.username)+"&limit=60");
  if(!r.ok){ const e=await r.json(); box.innerHTML=`<div class="empty">${e.error||"加载失败"}</div>`; return; }
  const msgs = await r.json();
  if(current !== selected) return; // A previous chat response must not render into the newly selected chat.
  lastMsgs = msgs;
  const prevTop=box.scrollTop;
  box.innerHTML="";
  if(!msgs.length){ box.innerHTML=`<div class="empty">暂无消息</div>`; return; }
  for(const m of msgs){
    const div=document.createElement("div");
    div.className="msg"+(m.is_self?" self":"");
    let inner="";
    if(current.is_group && !m.is_self) inner+=`<div class="who">${escape_(m.sender_name||m.sender||"")}</div>`;
    let text = m.content;
    if(m.type===3){
      if(imgReady){ inner+=`<img src="/api/msgimage?chat=${encodeURIComponent(current.username)}&id=${m.local_id}" style="max-width:200px;border-radius:6px;display:block;cursor:zoom-in" onclick="showImg(this.src)" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'[等待图片就绪]' }))">`; text=null; }
      else text="[图片]";
    }
    else if(m.type===34){   // 语音：可播(全量解密)
      const u=`/api/msgvoice?chat=${encodeURIComponent(current.username)}&id=${m.local_id}`;
      inner+=`<audio controls preload="none" src="${u}" style="height:32px;vertical-align:middle"></audio> <span style="color:var(--muted);font-size:12px">${escape_(m.content||"[语音]")}</span>`;
      text=null;
    }
    else if(m.type===43){   // 视频：缩略图作封面，点开若无本地明文则只显示封面
      const t=`/api/msgvideothumb?chat=${encodeURIComponent(current.username)}&id=${m.local_id}`;
      const v=`/api/msgvideo?chat=${encodeURIComponent(current.username)}&id=${m.local_id}`;
      inner+=`<video controls preload="none" poster="${t}" src="${v}" style="max-width:220px;border-radius:6px;display:block" onerror="this.removeAttribute('src')"></video><span style="color:var(--muted);font-size:12px">${escape_(m.content||"[视频]")}</span>`;
      text=null;
    }
    else if(m.type===47) text="[表情]";
    if(m.article){   // 公众号图文/卡片/服务通知
      const a=m.article; let h="";
      if(a.articles&&a.articles.length>1){   // 仅多篇图文才用列表；单篇/通知显示 标题+详情
        h=a.articles.map(x=>x.url
          ? `<div style="padding:2px 0">📄 <a href="${escape_(/^https?:\/\//i.test(x.url)?x.url:"#")}" target="_blank" rel="noopener noreferrer" style="color:#576b95;text-decoration:none">${escape_(x.title)}</a></div>`
          : `<div style="padding:2px 0">📄 ${escape_(x.title)}</div>`).join("");
      } else {
        h=(a.title?`<div style="font-weight:600">${escape_(a.title)}</div>`:"")
         +(a.des?`<div style="color:#555;white-space:pre-wrap;margin-top:2px">${escape_(a.des)}</div>`:"")
         +(a.url?`<div style="margin-top:4px"><a href="${escape_(/^https?:\/\//i.test(a.url)?a.url:"#")}" target="_blank" rel="noopener noreferrer" style="color:#576b95;font-size:12px;text-decoration:none">查看链接 ›</a></div>`:"");
      }
      inner+=`<div style="border-left:3px solid var(--brand);background:#f7f8fa;border-radius:6px;padding:7px 9px">${h}</div>`;
      text=null;
    }
    if(m.revoke_image && imgReady){   // 撤回的图片：本地 .dat 多半还在，仍能解出来显示
      inner+=`<div style="color:var(--muted);font-size:12px;margin-bottom:3px">${escape_(text||"撤回了一张图片")}</div>`;
      inner+=`<img src="/api/msgimage?chat=${encodeURIComponent(current.username)}&id=${m.revoke_local_id||m.local_id}" style="max-width:200px;border-radius:6px;display:block;cursor:zoom-in;opacity:.85" onclick="showImg(this.src)" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'[撤回的图片已不在本地]'}))">`;
      text=null;
    }
    else if(m.revoke_video && imgReady){   // 撤回的视频：至少还能显示封面
      inner+=`<div style="color:var(--muted);font-size:12px;margin-bottom:3px">${escape_(text||"撤回了一个视频")}</div>`;
      inner+=`<img src="/api/msgvideothumb?chat=${encodeURIComponent(current.username)}&id=${m.revoke_local_id||m.local_id}" style="max-width:200px;border-radius:6px;display:block;opacity:.85" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'[撤回的视频已不在本地]'}))">`;
      text=null;
    }
    if(text!==null) inner+=`<div style="white-space:pre-wrap">${escape_(text)}</div>`;
    if(m.media_label) inner+=`<div class="sub">${escape_(m.media_label)}</div>`;
    if(m.refer) inner+=`<div class="refer">${escape_(m.refer.displayname||"")}: ${escape_(m.refer.content||"")}</div>`;
    // 分类徽章(非纯文字才显示,让分类结果一眼可见;红包/转账带金额)
    if(m.category && m.category!=="text"){
      let tag=m.category_name||m.category;
      if(m.meta&&m.meta.amount) tag+=` ¥${m.meta.amount}`;
      const hot=(m.category==="red_packet"||m.category==="transfer");
      inner+=`<span style="display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;margin-top:3px;`
        +`background:${hot?"#ffece0":"#eef0f3"};color:${hot?"#d4380d":"#8a94a6"}">${escape_(tag)}</span>`;
    }
    inner+=`<div class="time">${fmtTime(m.create_time)}</div>`;
    const face=document.createElement('img');
    face.className='avatar'; face.alt=m.sender_name||'';
    face.src=avatarURL(m.sender||(!m.is_self?current.username:''));
    face.onerror=()=>{face.onerror=null;face.src='/static/avatar-placeholder.svg';};
    div.innerHTML=`<div class="bubble">${inner}</div>`;
    div.prepend(face);
    box.appendChild(div);
  }
  // 追加本会话本地已发图片预览（网页即时可见）
  for(const p of (sentImg[current.username]||[])){
    const div=document.createElement("div");
    div.className="msg self";
    div.innerHTML=`<div class="bubble"><img src="${p.url}" style="max-width:180px;border-radius:6px;display:block;cursor:zoom-in" onclick="showImg(this.src)"><div class="time">${fmtTime(p.ts)} 本地预览</div></div>`;
    box.appendChild(div);
  }
  // 在底部才自动滚到底(否则保持用户浏览位置,避免刷新时乱跳)
  if(atBottom){
    const toBottom=()=>{ box.scrollTop=box.scrollHeight; };
    toBottom();
    requestAnimationFrame(toBottom);
    // 图片/视频异步加载会改变高度，加载完再滚一次，确保停在最新消息
    box.querySelectorAll("img,video").forEach(el=>{
      el.addEventListener("load", toBottom, {once:true});
      el.addEventListener("loadeddata", toBottom, {once:true});
    });
    setTimeout(toBottom, 200);
  } else box.scrollTop=prevTop;
}

let sending=false;
const sentImg={};   // username -> [{url, ts}]  本地已发图片预览
function setSending(v){
  sending=v;
  $("#sendBtn").disabled=v; $("#imgBtn").disabled=v;
  $("#sendBtn").textContent=v?"发送中…":"发送";
  $("#sendBtn").style.opacity=v?0.6:1;
}
async function send(kind, payload, localUrl){
  if(!current || sending) return;
  setSending(true);
  const body={to: current.name || current.username, chat: current.username, type:kind};
  if(kind==="text") body.content=payload; else body.path=payload;
  try{
    const r=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const res=await r.json();
    if(!res.ok){ toast("发送失败："+(res.error||"")); setSending(false); return; }
    // 异步队列：后台单 worker 一条条发(视觉核对会话+发后校验，十几秒/条)，新消息排队不打断
    // 正在发的那条。先乐观清空输入、轮询消息(落库即显示)+轮询任务状态。不阻塞界面。
    toast(res.ahead>0 ? ("已排队(前面"+res.ahead+"条)…") : "发送中…(后台核对并确认送达)");
    if(kind==="text") $("#msgInput").value="";
    if(kind==="image" && localUrl){ (sentImg[current.username]=sentImg[current.username]||[]).push({url:localUrl, ts:Date.now()/1000}); }
    setSending(false);
    loadMessages();
    if(res.queued && res.job){ pollSend(res.job); }
    else { setTimeout(loadMessages,2500); }
  }catch(e){ toast("发送出错"); setSending(false); }
}
async function pollSend(job){
  let lastPos=-1;
  for(let i=0;i<30;i++){                      // 最多轮询 ~60s(含排队)
    await new Promise(r=>setTimeout(r,2000));
    loadMessages();                          // 消息落库就会显示
    let s; try{ s=await(await fetch("/api/send/status?job="+encodeURIComponent(job))).json(); }catch(e){ continue; }
    if(s.status==="queued" && s.position!=null && s.position!==lastPos){ lastPos=s.position; toast("排队中(第"+s.position+"位)…"); }
    if(s.status==="done"){ toast(s.send_status==="submitted"?"已执行发送，请在微信确认":s.verified?"✅ 已发送(已核对会话)":"已发送"); loadMessages(); return; }
    if(s.status==="error"){ toast("发送失败："+(s.wrong_chat?"打开的会话不对，已阻止":(s.error||"未确认"))); return; }
  }
}

let _pushTargets=[];
let _pushNames=[];
function pushTargetRow(t,i){
  if(t.type==="wechat")
    return `<div class="row" style="gap:6px;align-items:center"><span class="pill">微信</span><input class="ptto" list="pnamelist" data-i="${i}" value="${escape_(t.to||"")}" placeholder="选/搜好友·群" style="flex:1;padding:4px"><label class="sub" style="cursor:pointer"><input type="checkbox" class="pten" data-i="${i}" ${t.enabled===false?"":"checked"}>启用</label><span style="cursor:pointer;color:#d4380d" onclick="_pushTargets.splice(${i},1);renderPush()">✕</span></div>`;
  return `<div class="row" style="gap:6px;align-items:center"><span class="pill">webhook</span><input class="pturl" data-i="${i}" value="${escape_(t.url||"")}" placeholder="https://…" style="flex:1;padding:4px"><label class="sub" style="cursor:pointer"><input type="checkbox" class="pten" data-i="${i}" ${t.enabled===false?"":"checked"}>启用</label><span style="cursor:pointer;color:#d4380d" onclick="_pushTargets.splice(${i},1);renderPush()">✕</span></div>`;
}
async function renderPush(){
  const p=$("#pushPanel");
  if(!p.classList.contains("show")){
    const [cfg,ss,gs,cs]=await Promise.all([
      (await fetch("/api/bot/push")).json(),
      fetch("/api/sessions").then(r=>r.json()).catch(()=>[]),
      fetch("/api/groups").then(r=>r.json()).catch(()=>[]),
      fetch("/api/contacts").then(r=>r.json()).catch(()=>[])
    ]);
    _pushTargets=(cfg.targets||[]).map(t=>({...t}));
    p._cfg=cfg;
    // 可选好友/群显示名(去重·发送用的正是显示名)
    const names=[];
    (Array.isArray(cs)?cs:[]).forEach(c=>{ if(c.name)names.push(c.name); });
    (Array.isArray(gs)?gs:[]).forEach(g=>{ if(g.name)names.push(g.name); });
    (Array.isArray(ss)?ss:[]).forEach(s=>{ if(s.name)names.push(s.name); });
    _pushNames=[...new Set(names)].sort((a,b)=>a.localeCompare(b,"zh"));
  }
  const cfg=p._cfg||{};
  const dlist=`<datalist id="pnamelist">${_pushNames.map(n=>`<option value="${escape_(n)}">`).join("")}</datalist>`;
  p.innerHTML=`<h3>监听推送 <span style="float:right;cursor:pointer;color:#999" onclick="closePanel('#pushPanel')">✕</span></h3>
    ${dlist}
    <div class="sub" style="margin-bottom:8px">监听会话里<b>任何人</b>的<b>任何消息</b>(文字/图片/红包/转账…)都转发到下面的目标。来源默认=<b>监听设置</b>里的会话(留空即用它)。微信目标点输入框会弹出好友/群列表可选。</div>
    <label class="row" style="cursor:pointer;margin-bottom:6px"><input type="checkbox" id="pen" ${cfg.enabled?"checked":""} style="margin-right:8px"><b>启用监听推送</b></label>
    <label class="row" style="cursor:pointer;margin-bottom:8px"><input type="checkbox" id="pself" ${cfg.include_self?"checked":""} style="margin-right:8px">连自己发的也推</label>
    <div style="margin:8px 0 4px"><b>推送目标</b></div>
    <div id="ptlist">${_pushTargets.map(pushTargetRow).join("")||'<div class="sub">还没有目标</div>'}</div>
    <div class="row" style="gap:6px;margin-top:6px">
      <button id="padd_wx">+ 微信好友</button>
      <button id="padd_wh">+ webhook</button>
    </div>
    <div class="row" style="gap:6px;margin-top:12px">
      <button id="psave" class="primary">保存</button>
      <button id="ptest">发测试</button>
    </div>`;
  const sync=()=>{ document.querySelectorAll("#ptlist .ptto").forEach(e=>_pushTargets[+e.dataset.i].to=e.value);
    document.querySelectorAll("#ptlist .pturl").forEach(e=>_pushTargets[+e.dataset.i].url=e.value);
    document.querySelectorAll("#ptlist .pten").forEach(e=>_pushTargets[+e.dataset.i].enabled=e.checked);
    p._cfg={...(p._cfg||{}),enabled:$("#pen").checked,include_self:$("#pself").checked}; };
  $("#padd_wx").onclick=()=>{ sync(); _pushTargets.push({type:"wechat",to:"",enabled:true}); renderPush(); };
  $("#padd_wh").onclick=()=>{ sync(); _pushTargets.push({type:"webhook",url:"",enabled:true}); renderPush(); };
  $("#psave").onclick=async()=>{ sync();
    const body={enabled:$("#pen").checked,include_self:$("#pself").checked,targets:_pushTargets};
    const r=await(await fetch("/api/bot/push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
    p._cfg=r.push; _pushTargets=(r.push.targets||[]).map(t=>({...t}));
    toast("已保存推送 "+(r.push.targets||[]).length+" 个目标"); };
  $("#ptest").onclick=async()=>{ sync();
    const r=await(await fetch("/api/bot/push/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targets:_pushTargets})})).json();
    toast("测试已发出，看日志"); console.log("push test",r.log); };
  p.classList.add("show");
}

      <button class="schRun" data-id="${t.id}" title="立即执行一次" style="margin-left:4px">▶</button>
      <button class="schDel" data-id="${t.id}" style="margin-left:4px">删</button>
      <div class="schForm" id="schForm-${t.id}" style="display:none;flex-basis:100%;margin-top:6px;padding:8px;background:#f6f6f6;border-radius:6px">
        <div class="sub" style="margin-bottom:4px">时间(cron 5字段，如 <code>0 18 * * 3-5</code>=周三到五18点；一次性用下面的日期)</div>
        <input class="schCron" data-id="${t.id}" value="${escape_(t.cron||'')}" placeholder="分 时 日 月 周" style="width:100%;padding:5px;margin-bottom:5px">
        <input class="schOnce" data-id="${t.id}" value="${escape_(t.once_at||'')}" placeholder="一次性: YYYY-MM-DD HH:MM (留空=用上面cron)" style="width:100%;padding:5px;margin-bottom:5px">
        <input class="schTitle" data-id="${t.id}" value="${escape_(t.title||'')}" placeholder="标题" style="width:100%;padding:5px;margin-bottom:5px">
        <textarea class="schPrompt" data-id="${t.id}" placeholder="到点要说/做的内容" style="width:100%;height:44px;padding:5px;margin-bottom:5px">${escape_(t.prompt||'')}</textarea>
        <button class="schSave primary" data-id="${t.id}">保存</button>
        <button class="schCancel" data-id="${t.id}" style="margin-left:4px">取消</button>
        <span class="schEditMsg sub" data-id="${t.id}" style="margin-left:6px"></span>
      </div>
    </div>`).join("") || '<div class="sub">还没有定时任务</div>';
  p.innerHTML=`<h3>定时任务 <span style="float:right;cursor:pointer;color:#999" onclick="closePanel('#schedulePanel')">✕</span></h3>
    <div class="sub" style="margin-bottom:6px">用一句话描述：创建/取消/列出。到点把结果发给对方（私聊直发，群聊@他）。</div>
    <textarea id="schNL" placeholder="例：每天早上9点在test-001群@大南是逗比 提醒他交周报&#10;例：明天下午3点提醒老婆去开家长会&#10;例：取消周报提醒&#10;例：列出所有定时任务" style="width:100%;height:70px;padding:6px;margin-bottom:6px"></textarea>
    <button id="schGo" class="primary">执行</button>
    <div id="schMsg" class="sub" style="margin:6px 0"></div>
    <hr style="margin:10px 0;border:none;border-top:1px solid #eee">
    <h3>当前任务 <span class="sub" style="font-weight:normal">${(d.tasks||[]).length} 个</span></h3>
    ${rows}
    ${(d.log||[]).length?('<hr style="margin:10px 0;border:none;border-top:1px solid #eee"><div class="sub" style="white-space:pre-wrap;color:#999">'+escape_((d.log||[]).slice(-6).join("\\n"))+'</div>'):''}`;
  $("#schGo").onclick=async()=>{
    const text=$("#schNL").value.trim(); if(!text){ return; }
    $("#schMsg").textContent="处理中…";
    try{
      const r=await(await fetch("/api/schedule/nl",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})})).json();
      $("#schMsg").textContent=(r.ok?"✅ ":"⚠️ ")+(r.message||(r.action==="list"?("共 "+(r.tasks||[]).length+" 个任务"):""));
      if(r.ok){ $("#schNL").value=""; renderSchedule(); }
    }catch(e){ $("#schMsg").textContent="出错:"+e; }
  };
  document.querySelectorAll(".schDel").forEach(b=>b.onclick=async()=>{
    await fetch("/api/schedule/"+b.dataset.id+"/delete",{method:"POST"}); toast("已删除"); renderSchedule();
  });
  document.querySelectorAll(".schRun").forEach(b=>b.onclick=async()=>{
    await fetch("/api/schedule/"+b.dataset.id+"/run",{method:"POST"}); toast("已触发执行(看聊天)"); });
  document.querySelectorAll(".schEdit").forEach(b=>b.onclick=()=>{
    const f=$("#schForm-"+b.dataset.id); if(f) f.style.display=(f.style.display==="none"?"block":"none");
  });
  document.querySelectorAll(".schCancel").forEach(b=>b.onclick=()=>{
    const f=$("#schForm-"+b.dataset.id); if(f) f.style.display="none";
  });
  document.querySelectorAll(".schSave").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    const pick=(cls)=>document.querySelector("."+cls+"[data-id='"+id+"']");
    const msg=pick("schEditMsg");
    const body={ cron:pick("schCron").value.trim(), once_at:pick("schOnce").value.trim(),
                 title:pick("schTitle").value.trim(), prompt:pick("schPrompt").value };
    msg.textContent="保存中…";
    try{
      const r=await(await fetch("/api/schedule/"+id+"/update",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
      if(r.ok){ toast("已更新"); renderSchedule(); }
      else{ msg.textContent="⚠️ "+(r.message||"保存失败"); }
    }catch(e){ msg.textContent="出错:"+e; }
  });
}

let botRunning=false;
async function loadBot(){
  try{ const b=await(await fetch("/api/bot")).json();
    botRunning=b.running;
    $("#botBtn").textContent="机器人："+(b.running?(b.sending_available===false?"监听中 · 微信发送不可用⏹":b.sending_scope==="legacy_search"?"运行中 · 最早版发送⏹":b.sending_scope==="private_text"?"运行中 · 私聊文字⏹":"运行中⏹"):"已停止▶");
    $("#botBtn").title=b.sending_available===false?"真实微信发送适配器尚不可用，自动回复和打招呼不能发出；与画像开关无关。":b.sending_scope==="legacy_search"?"最早版：搜索联系人或群聊后粘贴发送，支持文字和图片。":b.sending_scope==="private_text"?"私聊文字使用原生微信号核对；群聊和图片尚未恢复。发送时请勿同时操作 VNC。":"切换机器人监听状态";
    $("#botBtn").className=b.running?"primary":"";
  }catch(e){}
}
$("#botBtn").onclick=async()=>{
  await fetch("/api/bot/"+(botRunning?"stop":"start"),{method:"POST"});
  await loadBot(); toast(botRunning?"机器人已启动":"机器人已停止");
};

async function loadMediaStatus(){
  try{const state=await(await fetch('/api/media/status')).json(); $("#mediaState").textContent=state.label||'媒体暂未连接';}
  catch(e){$("#mediaState").textContent='媒体暂未连接';}
}
document.getElementById('configExportBtn').onclick=async()=>{const r=await fetch('/api/config/export',{headers:{'X-Wxbot-Local-Admin':'1'}});if(!r.ok){alert('导出失败');return;}const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='wxbot-config-backup.zip';a.click();};
document.getElementById('configImportBtn').onclick=()=>document.getElementById('configImportFile').click();
document.getElementById('configImportFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/api/config/import',{method:'POST',headers:{'X-Wxbot-Local-Admin':'1'},body:fd});const d=await r.json();alert(d.message||d.error||'导入完成');e.target.value='';};
loadMediaStatus(); setInterval(loadMediaStatus,8000);
loadStatus(); loadTab("sessions"); loadBot();
setInterval(loadStatus, 8000); setInterval(loadBot, 8000);
// 自动刷新(无需手动刷新页面)：当前会话消息 1.2s(后端已事件驱动~0.3s刷解密库,前端跟上)；
// 会话列表+未读角标 3s(始终刷,任意tab都更新角标)
setInterval(()=>{ if(current && !sending) loadMessages(); }, 1200);
setInterval(refreshSessions, 3000);
</script>
</body>
