<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · wxbot</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;background:#f5f7f4;color:#24362e;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
form{background:#fff;border:1px solid #d5dfd8;border-radius:12px;padding:28px 26px;width:min(360px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0 0 6px}
p{color:#60756a;font-size:13px;margin:0 0 16px}
label{display:block;font-size:13px;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #b9c9bf;border-radius:6px;font:inherit}
button{width:100%;margin-top:16px;padding:9px;border:0;border-radius:6px;background:#23815a;color:#fff;font:inherit;cursor:pointer}
.error{color:#9b302d;font-size:13px;min-height:1.2em;margin-top:8px}
</style>
<form id="f">
  <h1>管理后台</h1>
  <p>登录后才能访问 5100。</p>
  <label>账号</label>
  <input id="user" name="username" autocomplete="username" autofocus>
  <label>密码</label>
  <input id="pass" name="password" type="password" autocomplete="current-password">
  <button type="submit">登录</button>
  <div class="error" id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('user').value,
      password: document.getElementById('pass').value
    })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.ok) { err.textContent = d.error || '登录失败'; return; }
  location.href = '/';
};
</script>
</html>
